name: download page

# Publishes site/ (the page where people download the app) with GitHub Pages. Free, nothing to run.
# One-time setup by the repository owner: Settings > Pages > Source: "GitHub Actions". See docs/DOWNLOAD.md.
on:
  push:
    paths: ["site/**", "tests/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/site -v

  deploy:
    needs: test
    # Pages only deploys from the default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Make a QR code of the page address (the page hides it if this fails)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qrencode || true
          qrencode -t SVG -m 2 -s 6 -o site/qr.svg "${{ steps.pages.outputs.base_url }}/" || echo "QR code not made; the page works without it"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
