name: fraudintel tests

on:
  push:
    paths: ["fraudintel/**", "shared/**", ".github/workflows/fraudintel-tests.yml"]
  pull_request:
    paths: ["fraudintel/**", "shared/**", ".github/workflows/fraudintel-tests.yml"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and test (skipped until the component has tests)
        run: |
          if ls fraudintel/tests/test_*.py >/dev/null 2>&1; then
            pip install -r fraudintel/requirements.txt
            python -m pytest fraudintel/tests -v
          else
            echo "No tests yet in fraudintel, nothing to run."
          fi
