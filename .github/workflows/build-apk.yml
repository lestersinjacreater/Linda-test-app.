name: Build APK

# Builds and tests the Android app on every push and pull request.
# On the default branch (or when run by hand) it also publishes to the "latest-build" pre-release:
#   linda.apk        the SHRUNK build (R8 removes unused code and resources): small and quick to download.
#   linda-debug.apk  the full debug build, kept so existing links work and as a fallback if the shrunk one misbehaves.
# Both are signed with the same committed key, so either installs over the other.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create the latest-build release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Provides a `gradle` command (8.9, the pinned version) and caches Gradle downloads.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The wrapper jar is committed, but regenerate it if it is ever missing.
      - name: Ensure Gradle wrapper exists
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi

      - name: Unit tests, debug APK and shrunk APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Check APK sizes (debug under 15 MB; shrunk build budget 5 MB, root CLAUDE.md 7.1)
        run: |
          debug=$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)
          shrunk=$(stat -c%s android/app/build/outputs/apk/release/app-release.apk)
          echo "Debug APK:  $((debug / 1024)) KB"
          echo "Shrunk APK: $((shrunk / 1024)) KB"
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "Debug: $((debug / 1024)) KB · Shrunk: $((shrunk / 1024)) KB (budget 5120 KB)" >> "$GITHUB_STEP_SUMMARY"
          test "$debug" -lt $((15 * 1024 * 1024))
          if [ "$shrunk" -ge $((5 * 1024 * 1024)) ]; then echo "::warning::Shrunk APK is over the 5 MB budget"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: linda-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

      - name: Publish to the latest-build pre-release
        # Publish from the repository's DEFAULT branch, whatever it is called, or when run by hand.
        if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk linda.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk linda-debug.apk
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build linda.apk linda-debug.apk \
            --prerelease \
            --title "Latest build" \
            --target "$GITHUB_SHA" \
            --notes "Automated build of commit $GITHUB_SHA on branch $GITHUB_REF_NAME. linda.apk is the small shrunk build; linda-debug.apk is the full debug build (same signature, either installs over the other)."
