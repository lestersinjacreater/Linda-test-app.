name: Build APK

# Builds and tests the Android app on every push and pull request.
# On main (or when run by hand) it also publishes the debug APK to the
# "latest-build" pre-release, so teammates can download it onto their phones.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create the latest-build release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Provides a `gradle` command (8.9, the pinned version) and caches Gradle downloads.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The wrapper jar is committed, but regenerate it if it is ever missing.
      - name: Ensure Gradle wrapper exists
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi

      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Check APK size (limit 15 MB)
        run: |
          size=$(stat -c%s android/app/build/outputs/apk/debug/app-debug.apk)
          echo "APK size: $((size / 1024)) KB"
          test "$size" -lt $((15 * 1024 * 1024))

      - uses: actions/upload-artifact@v4
        with:
          name: linda-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the latest-build pre-release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk linda-debug.apk
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build linda-debug.apk \
            --prerelease \
            --title "Latest build" \
            --target "$GITHUB_SHA" \
            --notes "Automated debug build of commit $GITHUB_SHA on branch $GITHUB_REF_NAME. Download linda-debug.apk and install it on your phone."
