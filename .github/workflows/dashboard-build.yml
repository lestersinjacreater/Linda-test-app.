name: dashboard build

on:
  push:
    paths: ["dashboard/**", "scripts/**", ".github/workflows/dashboard-build.yml"]
  pull_request:
    paths: ["dashboard/**", "scripts/**", ".github/workflows/dashboard-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build (skipped until the dashboard exists)
        run: |
          if [ -f dashboard/package.json ]; then
            cd dashboard && npm ci && npm run typecheck && npm test && npm run build
          else
            echo "No dashboard yet."
          fi
