name: Live phone

# A virtual Android phone you can use from your browser, with Linda installed (tools/virtual-phone/README.md).
# Start it from the Actions tab: "Live phone" -> "Run workflow". In about 5 minutes the "Live phone" issue gets a
# comment with the screen's address (it only opens with your LIVE_PHONE_KEY secret) and the /phone commands
# (real SMS, real calls, taps, screenshots) that you, collaborators, or Claude can post on that issue.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long the phone stays on (5 to 300 minutes)"
        default: "60"
      check_screen:
        description: "Self-check: a browser on the runner opens the screen and posts screenshots"
        type: boolean
        default: false
  push: # TEMPORARY: lets Claude test the session from this branch before it is merged; removed before review
    branches: [feature/live-phone]

permissions:
  contents: write # the session's screenshots go to a pre-release
  issues: write # the "Live phone" issue: the address, the commands and the replies

concurrency:
  group: live-phone
  cancel-in-progress: true # starting a new session ends the old one

jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ws-scrcpy (MIT) shows and controls the phone screen in a browser. Pinned commit; its remote shell, file
      # browser and dev tools are switched off, so the page can only show and touch the screen.
      - name: Build the browser screen (ws-scrcpy)
        run: |
          git clone -q https://github.com/NetrisTV/ws-scrcpy.git
          cd ws-scrcpy
          git checkout -q cd6cea6ebde17af6685c2b325183fc24bef9d52b
          echo '{"INCLUDE_DEV_TOOLS": false, "INCLUDE_ADB_SHELL": false, "INCLUDE_FILE_LISTING": false}' > build.config.override.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm run dist
          cd dist && npm install --omit=dev --ignore-scripts --no-audit --no-fund

      # cloudflared (Apache-2.0) gives the session a free temporary https address (a "quick tunnel", no account).
      - name: Get cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright for the screen self-check
        if: inputs.check_screen || github.event_name == 'push'
        run: pip install playwright==1.56.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Live phone session
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LIVE_PHONE_KEY: ${{ secrets.LIVE_PHONE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes || '25' }}
          CHECK_SCREEN: ${{ inputs.check_screen || github.event_name == 'push' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/virtual-phone/live.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-phone-logs
          path: |
            live-phone-out/*.log
            live-phone-out/*.txt
